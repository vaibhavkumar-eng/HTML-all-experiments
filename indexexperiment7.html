<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Navigation Menu Demo</h1>

    <h2>Block examples</h2>
    
    <nav class="nav-block">
        <a href="#">Home</a><br>
        <a href="#">Products</a><br>
        <a href="#">About</a><br>
        <a href="#">Contact</a><br>
    </nav>

    <h3>Inline Example</h3>
    <nav class="block-inline">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        
    </nav>
    <h3>Inline-Block example</h3>
    <nav class="inline-example">
        <a href="#">Home</a>
        <a href="#">Products</a>       
         <a href="#">About</a>
        <a href="#">Contact</a>

    </nav>
    
    <h3>Float Example</h3>
    <nav class="inline-float">
        <a href="#">Home</a>        
        <a href="#">Products</a>        
        <a href="#">About</a>        
        <a href="#">Contact</a>
    </nav>
        
</body>
</html>
