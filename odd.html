<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My E-commerce Store</h1>
    </header>

    <article class="product-card">
        
        <img src="https://via.placeholder.com/300x200?text=Projector" alt="Home Projector" class="product-image">
        
        <div class="product-info">
            <h3>Home Projector</h3>
            <p class="description">Full HD 1080p projector for an amazing home theater experience.</p>
            <p class="price">Price: ₹12,999</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </div>
        
    </article>

</body>
</html>
